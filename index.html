<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revue de presse – BO Escrime</title>
<style>
:root{--bx:#7a1236;--rs:#c81d5c;--bg:#faf6f7;--tx:#2a1b20;--mut:#7d6a70;--bd:#e8dde1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:linear-gradient(135deg,var(--bx),var(--rs));color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:1.7rem}
header p{margin:6px 0 0;opacity:.9;font-size:.95rem}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.bar input,.bar select{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font-size:.95rem;background:#fff}
.bar input[type=search]{flex:1;min-width:160px}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 16px;font-size:.95rem;font-weight:600}
.btn{background:var(--bx);color:#fff}.btn:hover{background:var(--rs)}
.btn2{background:#fff;color:var(--bx);border:1px solid var(--bx)}
.btnd{background:#fff;color:#b00020;border:1px solid #b00020}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.thumb{position:relative;aspect-ratio:16/10;background:#eee center/cover no-repeat;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb .play{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.thumb .tag{position:absolute;top:8px;left:8px;background:var(--bx);color:#fff;font-size:.72rem;padding:3px 8px;border-radius:12px}
.nothumb{font-size:2.4rem;color:#b9a6ac}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:.82rem;color:var(--mut)}
.meta b{color:var(--bx)}
.body h3{margin:0;font-size:1.05rem;line-height:1.3}
.body p{margin:0;font-size:.9rem;color:#4a3a40}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.acts a,.acts button{font-size:.85rem;padding:7px 12px;text-decoration:none}
.acts a{background:var(--bx);color:#fff;border-radius:8px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.year{grid-column:1/-1;font-size:1.2rem;color:var(--bx);border-bottom:2px solid var(--bd);padding-bottom:4px;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:50}
.modal.on{display:flex}
.box{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:520px;margin:auto}
.box h2{margin:0 0 12px;color:var(--bx)}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
.box input,.box select,.box textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font-size:1rem;font-family:inherit}
.row{display:flex;gap:10px}.row>div{flex:1}
.prev{margin-top:8px;max-width:100%;max-height:220px;border-radius:8px;display:none}
.prog{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:10px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--rs)}
.msg{font-size:.88rem;margin-top:8px;color:#b00020}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.lb{background:rgba(0,0,0,.92);align-items:center}
.lb .in{max-width:96vw;max-height:92vh;position:relative}
.lb img,.lb video,.lb iframe{max-width:96vw;max-height:88vh;border-radius:6px;display:block}
.lb iframe{width:min(90vw,900px);aspect-ratio:16/9;border:0}
.lb .x{position:fixed;top:10px;right:14px;background:#fff;color:#000;border-radius:50%;width:38px;height:38px;padding:0;font-size:20px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <h1>📰 Revue de presse</h1>
  <p>Biarritz Olympique Escrime dans les médias</p>
</header>

<div class="wrap">
  <div class="bar">
    <input type="search" id="q" placeholder="Rechercher (titre, média…)">
    <select id="fType"><option value="">Tout</option><option value="article">Articles</option><option value="video">Vidéos</option></select>
    <select id="fMedia"><option value="">Tous les médias</option></select>
    <button class="btn" id="bAdd">＋ Ajouter</button>
    <button class="btn2 hide" id="bOut">Quitter le mode édition</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty hide" id="empty">Aucun élément pour le moment.</div>
</div>

<!-- Formulaire ajout / modification -->
<div class="modal" id="mForm">
  <form class="box" id="form">
    <h2 id="fTitle">Ajouter à la revue de presse</h2>
    <label>Type</label>
    <select id="type"><option value="article">Article de presse</option><option value="video">Vidéo (TV, web…)</option></select>
    <label>Titre *</label>
    <input id="titre" required maxlength="160" placeholder="Titre de l'article ou du reportage">
    <div class="row">
      <div><label>Média *</label><input id="media" required list="mediaList" maxlength="80" placeholder="Sud Ouest, France 3…"><datalist id="mediaList"></datalist></div>
      <div><label>Date *</label><input id="date" type="date" required></div>
    </div>
    <label>Photo / vidéo (depuis l'appareil)</label>
    <input id="file" type="file" accept="image/*,video/*">
    <img class="prev" id="prev" alt="">
    <label>Lien (facultatif : article en ligne, YouTube…)</label>
    <input id="lien" type="url" placeholder="https://…">
    <label>Description (facultatif)</label>
    <textarea id="desc" rows="3" maxlength="500"></textarea>
    <div class="prog" id="prog"><i></i></div>
    <div class="msg" id="msg"></div>
    <div class="foot">
      <button type="button" class="btn2" id="bCancel">Annuler</button>
      <button type="submit" class="btn" id="bSave">Enregistrer</button>
    </div>
  </form>
</div>

<!-- Code d'accès -->
<div class="modal" id="mCode">
  <form class="box" id="fCode">
    <h2>Accès membres</h2>
    <label>Code d'accès</label>
    <input id="code" type="password" autocomplete="off">
    <div class="msg" id="codeMsg"></div>
    <div class="foot"><button type="button" class="btn2" id="codeCancel">Annuler</button><button class="btn">Valider</button></div>
  </form>
</div>

<!-- Visionneuse -->
<div class="modal lb" id="lb"><button class="x" id="lbX">✕</button><div class="in" id="lbIn"></div></div>

<script>
const FB='https://bo-escrime-default-rtdb.europe-west1.firebasedatabase.app';
const CLOUD='du0nsof86', PRESET='bo_escrime_gallery';
const CODE='BOpresse'; // code pour ajouter / modifier / supprimer
const MAX_VIDEO_MB=100;

const $=id=>document.getElementById(id);
const fbGet=async p=>(await fetch(`${FB}${p}.json`)).json();
const fbPush=async(p,d)=>(await fetch(`${FB}${p}.json`,{method:'POST',body:JSON.stringify(d)})).json();
const fbSet=async(p,d)=>(await fetch(`${FB}${p}.json`,{method:'PUT',body:JSON.stringify(d)})).json();
const fbDelete=async p=>fetch(`${FB}${p}.json`,{method:'DELETE'});

let items=[], editId=null, pendingAfterCode=null;
const isAdmin=()=>sessionStorage.getItem('presseOK')==='1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>{const [y,m,j]=d.split('-').map(Number);return new Date(y,m-1,j).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})};

function ytId(u){const m=(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:null}
function thumbOf(it){
  if(it.poster) return it.poster;
  if(it.fileType==='image'&&it.fileUrl) return it.fileUrl.replace('/upload/','/upload/c_fill,w_600,h_375,q_auto/');
  const y=ytId(it.lien); if(y) return `https://img.youtube.com/vi/${y}/hqdefault.jpg`;
  return '';
}

async function load(){
  const data=await fbGet('/presse')||{};
  items=Object.entries(data).map(([id,v])=>({id,...v})).sort((a,b)=>b.date.localeCompare(a.date));
  const medias=[...new Set(items.map(i=>i.media))].sort((a,b)=>a.localeCompare(b,'fr'));
  $('mediaList').innerHTML=medias.map(m=>`<option value="${esc(m)}">`).join('');
  const cur=$('fMedia').value;
  $('fMedia').innerHTML='<option value="">Tous les médias</option>'+medias.map(m=>`<option ${m===cur?'selected':''}>${esc(m)}</option>`).join('');
  render();
}

function render(){
  const q=$('q').value.toLowerCase(), t=$('fType').value, m=$('fMedia').value;
  const list=items.filter(i=>(!t||i.type===t)&&(!m||i.media===m)&&(!q||(i.titre+' '+i.media+' '+(i.desc||'')).toLowerCase().includes(q)));
  $('empty').classList.toggle('hide',list.length>0);
  let html='',yr='';
  for(const i of list){
    const y=i.date.slice(0,4);
    if(y!==yr){yr=y;html+=`<div class="year">${y}</div>`}
    const th=thumbOf(i), isVid=i.type==='video';
    const hasView=i.fileUrl||ytId(i.lien);
    html+=`<div class="card">
      <div class="thumb" ${hasView?`onclick="openItem('${i.id}')"`:''} style="${th?`background-image:url('${esc(th)}')`:''}">
        ${th?'':`<span class="nothumb">${isVid?'🎬':'📰'}</span>`}
        <span class="tag">${isVid?'Vidéo':'Article'}</span>
        ${isVid&&hasView?'<span class="play">▶</span>':''}
      </div>
      <div class="body">
        <div class="meta"><b>${esc(i.media)}</b> · ${fmtDate(i.date)}</div>
        <h3>${esc(i.titre)}</h3>
        ${i.desc?`<p>${esc(i.desc)}</p>`:''}
        <div class="acts">
          ${i.lien?`<a href="${esc(i.lien)}" target="_blank" rel="noopener">${isVid?'Voir la vidéo':'Lire l\'article'}</a>`:''}
          ${isAdmin()?`<button class="btn2" onclick="editItem('${i.id}')">Modifier</button><button class="btnd" onclick="delItem('${i.id}')">Supprimer</button>`:''}
        </div>
      </div></div>`;
  }
  $('grid').innerHTML=html;
  $('bOut').classList.toggle('hide',!isAdmin());
}

function openItem(id){
  const i=items.find(x=>x.id===id); if(!i)return;
  const y=ytId(i.lien); let h='';
  if(i.fileUrl&&i.fileType==='video') h=`<video src="${esc(i.fileUrl)}" controls autoplay playsinline></video>`;
  else if(i.fileUrl) h=`<img src="${esc(i.fileUrl.replace('/upload/','/upload/q_auto,w_1800/'))}" alt="${esc(i.titre)}">`;
  else if(y) h=`<iframe src="https://www.youtube.com/embed/${y}?autoplay=1" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;
  $('lbIn').innerHTML=h; $('lb').classList.add('on');
}
function closeLb(){$('lb').classList.remove('on');$('lbIn').innerHTML=''}
$('lbX').onclick=closeLb;
$('lb').onclick=e=>{if(e.target.id==='lb')closeLb()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLb()});

/* ---- Accès ---- */
function needCode(fn){
  if(isAdmin()){fn();return}
  pendingAfterCode=fn; $('code').value=''; $('codeMsg').textContent=''; $('mCode').classList.add('on'); $('code').focus();
}
$('fCode').onsubmit=e=>{
  e.preventDefault();
  if($('code').value===CODE){sessionStorage.setItem('presseOK','1');$('mCode').classList.remove('on');render();const f=pendingAfterCode;pendingAfterCode=null;f&&f()}
  else $('codeMsg').textContent='Code incorrect.';
};
$('codeCancel').onclick=()=>$('mCode').classList.remove('on');
$('bOut').onclick=()=>{sessionStorage.removeItem('presseOK');render()};

/* ---- Formulaire ---- */
function openForm(it){
  editId=it?it.id:null;
  $('fTitle').textContent=it?'Modifier l\'élément':'Ajouter à la revue de presse';
  $('type').value=it?.type||'article'; $('titre').value=it?.titre||''; $('media').value=it?.media||'';
  $('date').value=it?.date||new Date().toLocaleDateString('sv-SE'); // date locale YYYY-MM-DD
  $('lien').value=it?.lien||''; $('desc').value=it?.desc||''; $('file').value='';
  $('prev').style.display='none'; $('msg').textContent=''; $('prog').style.display='none';
  $('mForm').classList.add('on');
}
$('bAdd').onclick=()=>needCode(()=>openForm(null));
window.editItem=id=>needCode(()=>openForm(items.find(x=>x.id===id)));
window.delItem=id=>needCode(async()=>{
  if(!confirm('Supprimer cet élément de la revue de presse ?'))return;
  await fbDelete('/presse/'+id); load();
});
$('bCancel').onclick=()=>$('mForm').classList.remove('on');
$('file').onchange=()=>{
  const f=$('file').files[0],p=$('prev');
  if(f&&f.type.startsWith('image/')){p.src=URL.createObjectURL(f);p.style.display='block'}else p.style.display='none';
};

// Réduit les photos (smartphone) avant envoi
function shrink(file,max=1800){
  return new Promise(res=>{
    const img=new Image(); img.onload=()=>{
      const r=Math.min(1,max/Math.max(img.width,img.height));
      if(r===1&&file.size<1.5e6){res(file);return}
      const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>res(b||file),'image/jpeg',.85);
    }; img.onerror=()=>res(file); img.src=URL.createObjectURL(file);
  });
}
function upload(blob,kind){
  return new Promise((ok,ko)=>{
    const fd=new FormData(); fd.append('file',blob); fd.append('upload_preset',PRESET); fd.append('folder','presse');
    const x=new XMLHttpRequest(); x.open('POST',`https://api.cloudinary.com/v1_1/${CLOUD}/${kind}/upload`);
    $('prog').style.display='block';
    x.upload.onprogress=e=>{if(e.lengthComputable)$('prog').firstChild.style.width=(e.loaded/e.total*100)+'%'};
    x.onload=()=>{try{const r=JSON.parse(x.responseText);x.status<300?ok(r):ko(new Error(r.error?.message||'Échec de l\'envoi'))}catch(e){ko(e)}};
    x.onerror=()=>ko(new Error('Erreur réseau'));
    x.send(fd);
  });
}

$('form').onsubmit=async e=>{
  e.preventDefault(); $('msg').textContent=''; $('bSave').disabled=true; $('bSave').textContent='Envoi…';
  try{
    const old=editId?items.find(x=>x.id===editId):null;
    const d={type:$('type').value,titre:$('titre').value.trim(),media:$('media').value.trim(),date:$('date').value,
      lien:$('lien').value.trim(),desc:$('desc').value.trim()};
    if(old){ for(const k of ['fileUrl','fileType','poster']) if(old[k]) d[k]=old[k]; }
    const f=$('file').files[0];
    if(f){
      const isVid=f.type.startsWith('video/');
      if(isVid&&f.size>MAX_VIDEO_MB*1048576) throw new Error(`Vidéo trop lourde (max ${MAX_VIDEO_MB} Mo). Utilisez plutôt un lien YouTube.`);
      const r=await upload(isVid?f:await shrink(f),isVid?'video':'image');
      d.fileUrl=r.secure_url; d.fileType=isVid?'video':'image';
      if(isVid) d.poster=r.secure_url.replace(/\.[a-z0-9]+$/i,'.jpg').replace('/upload/','/upload/so_0,c_fill,w_600,h_375/');
      else delete d.poster;
    }
    // Firebase refuse les valeurs undefined : on ne garde que les champs renseignés
    Object.keys(d).forEach(k=>{if(d[k]===''||d[k]==null)delete d[k]});
    editId?await fbSet('/presse/'+editId,d):await fbPush('/presse',d);
    $('mForm').classList.remove('on'); await load();
  }catch(err){$('msg').textContent=err.message}
  $('bSave').disabled=false; $('bSave').textContent='Enregistrer';
};

['q','fType','fMedia'].forEach(id=>$(id).addEventListener('input',render));
load();
</script>
</body>
</html>
